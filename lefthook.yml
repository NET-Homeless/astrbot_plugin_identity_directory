# lefthook 配置：前后端提交前全量质量守护
# 覆盖：格式化、代码质量检查、单元测试、多维隐私扫描、Commit Message 校验
pre-commit:
  parallel: false
  commands:
    # ====== 1. 深度隐私检查与版本一致性校验 ======
    privacy-scan:
      run: python3 scripts/privacy_check.py
    version-sync:
      run: python3 scripts/bump_version.py --check
    # ====== 2. 格式化 ======
    format-python:
      glob: "*.py"
      run: ruff format {staged_files}
      stage_fixed: true
    format-web:
      glob: "web/**/*.{ts,svelte,js,css,json}"
      run: cd web && vp check --fix
      stage_fixed: true

    # ====== 3. 代码质量检查 ======
    lint-python:
      glob: "*.py"
      run: ruff check --fix {staged_files}
      stage_fixed: true
    typecheck-python:
      glob: "*.py"
      run: pyright
    lint-web:
      glob: "web/**/*.{ts,svelte,js}"
      run: cd web && vp check

    # ====== 4. 单元测试 ======
    test-python:
      glob: "*.py"
      run: python3 -m unittest discover -s tests
    test-web:
      glob: "web/**/*.{ts,svelte}"
      run: cd web && pnpm test:e2e --reporter=line

commit-msg:
  commands:
    commitlint:
      run: bash scripts/commit-msg-check.sh "{1}"
