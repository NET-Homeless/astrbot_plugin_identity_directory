# lefthook 配置：前后端提交前全量质量守护
# 覆盖：格式化、代码质量检查、单元测试、多维隐私扫描、Commit Message 校验
pre-commit:
  parallel: false
  commands:
    # ====== 1. 深度隐私检查（最优先执行，拦截敏感 QQ 号、真实别名与凭据泄露）======
    privacy-scan:
      run: python3 scripts/privacy_check.py

    # ====== 2. 格式化 ======
    format-python:
      glob: "*.py"
      run: ruff format {staged_files} && git add {staged_files}
    format-web:
      glob: "web/**/*.{ts,svelte,js,css,json}"
      run: cd web && vp check --fix
      stage_fixed: true

    # ====== 3. 代码质量检查 ======
    lint-python:
      glob: "*.py"
      run: ruff check --fix {staged_files} && git add {staged_files}
    lint-web:
      glob: "web/**/*.{ts,svelte,js}"
      run: cd web && vp check

    # ====== 4. 单元测试 ======
    test-python:
      glob: "*.py"
      run: python3 -m unittest discover -s tests
    test-web:
      glob: "web/**/*.{ts,svelte}"
      run: cd web && pnpm test:e2e --reporter=line

commit-msg:
  commands:
    commitlint:
      run: |
        MSG_FILE="{1}"
        MSG=$(cat "$MSG_FILE" 2>/dev/null || echo "")
        # Conventional Commits 校验：type(scope): description
        # type: feat/fix/docs/style/refactor/test/chore/perf/build/ci/revert
        PATTERN='^(feat|fix|docs|style|refactor|test|chore|perf|build|ci|revert)(\(.+\))?: [A-Za-z0-9_ ,./\(\)-]{1,}$'
        if ! echo "$MSG" | grep -qE "$PATTERN"; then
          echo "❌ Commit Message 校验失败"
          echo "格式要求（全英文）：<type>(<scope>): <description>"
          echo "允许的 type: feat | fix | docs | style | refactor | test | chore | perf | build | ci | revert"
          echo "示例：feat(web): add merge dialog multi-select"
          exit 1
        fi
        echo "✅ Commit Message 格式合规"
