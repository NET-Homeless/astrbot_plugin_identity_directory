[tool.ruff]
target-version = "py312"
line-length = 110
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # Line too long (formatter handles it)
    "B008",  # Do not perform function call in argument defaults (AstrBot pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "tests"]
