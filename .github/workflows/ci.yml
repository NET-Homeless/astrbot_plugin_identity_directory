name: CI & Release

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Python Quality Gate & Unit Tests
  # =========================================================================
  test-python:
    name: Python Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest pytest-asyncio anyio

      - name: Privacy & credential security scan
        run: python3 scripts/privacy_check.py

      - name: Version synchronization check
        run: python3 scripts/bump_version.py --check

      - name: Ruff linter check
        run: ruff check .

      - name: Ruff formatting check
        run: ruff format --check .

      - name: Pyright static type checking
        run: pyright

      - name: Run test suite
        run: pytest

  # =========================================================================
  # 2. WebUI Quality Gate & Build Freshness Verification
  # =========================================================================
  test-web:
    name: WebUI Quality & Build Freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install WebUI dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run WebUI type & lint check
        working-directory: web
        run: pnpm check

      - name: Build WebUI
        working-directory: web
        run: pnpm build

      - name: Verify WebUI build artifact freshness
        run: |
          if [ -n "$(git status --porcelain pages/)" ]; then
            echo "❌ Error: 'pages/' build artifacts are stale or out of sync with 'web/' source!"
            echo "   Please run 'cd web && pnpm build' locally and commit the updated files."
            git diff pages/
            exit 1
          fi
          echo "✅ 'pages/' build artifacts are fresh and clean."

  # =========================================================================
  # 3. Auto Release & AstrBot Plugin Packaging
  # =========================================================================
  release:
    name: Auto Release & Package
    needs: [test-python, test-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine release version
        id: version_check
        run: |
          VERSION=$(python3 scripts/bump_version.py --get)
          TAG_NAME="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Tag ${TAG_NAME} already exists in repository. Skipping release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🚀 New version detected: ${TAG_NAME}. Proceeding with release."
          fi

      - name: Package AstrBot distribution zip
        if: steps.version_check.outputs.exists == 'false'
        run: |
          python3 scripts/package.py --output-dir dist

      - name: Generate structured release changelog
        if: steps.version_check.outputs.exists == 'false'
        run: |
          python3 scripts/generate_changelog.py --output dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: steps.version_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_check.outputs.tag }}
          name: Release ${{ steps.version_check.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.sha256
          draft: false
          prerelease: false
